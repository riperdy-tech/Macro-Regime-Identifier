# E1 reference labels, reference set v1.1 (v1 is in git history at ad96231). Plan section 9 step 2. Labelled from title, publisher and date only; see LABELLING.md for the rule.
# event: an event id, NONE (real news, no other item in this set belongs with it) or noise (non-news: advice column, preview, roundup, transcript, promotion).
# membership: absent = core; `peripheral` = excluded from every pair, gate and rate (see LABELLING.md, core and peripheral). n_items counts core + peripheral, n_core core only.
# report: items sharing a report id are the same report syndicated or republished; a singleton gets r_<first 6 hex of news_id>.
events:
  E_HOUTHI_SAUDI:
    definition: Plan example 2. The Houthi missile/drone campaign against Saudi Arabia (Riyadh and other airports, Aramco facilities incl. the Dhahran HQ), the Saudi/coalition military response, and consequences
      the headline itself attributes to the attacks (casualties, airline suspensions and safety advisories, Gulf-market and oil moves).
    related: []
    n_items: 41
    n_core: 27
  E_HOUTHI_ADEN_PALACE:
    definition: 'The Houthi missile attack on the Yemeni presidential palace complex in Aden (10-15). A separate event: different target, inside Yemen, against the Yemeni government.'
    related:
    - E_HOUTHI_SAUDI
    n_items: 3
    n_core: 2
  E_SAUDI_DEFENCE_SUPPORT:
    definition: Third countries (Syria, Turkey) weighing military or defence support for Saudi Arabia; the headlines do not themselves name the airport attacks.
    related:
    - E_HOUTHI_SAUDI
    n_items: 2
    n_core: 2
  E_COREWEAVE_DISTRESS:
    definition: 'Plan example 1. CoreWeave credit distress: bond yields near 15% (10-14) and record credit default swap cost (10-15), with stock reaction to them.'
    related: []
    n_items: 5
    n_core: 4
  E_CPI_SEP:
    definition: Plan example 3. The US September CPI release (10-14), its preview, and the market reaction the headline attributes to it (incl. rate-hike odds).
    related: []
    n_items: 5
    n_core: 3
  E_PPI_SEP:
    definition: The US September PPI release (10-15) and reaction.
    related:
    - E_CPI_SEP
    n_items: 2
    n_core: 2
  E_FOMC_MINUTES:
    definition: FOMC minutes released 10-07 (officials see another hike coming).
    related: []
    n_items: 2
    n_core: 2
  E_COOK_PANEL:
    definition: Trump's committee to investigate Fed governor Lisa Cook over mortgage-fraud claims (10-09).
    related: []
    n_items: 3
    n_core: 3
  E_SHELTON_ADVISER:
    definition: Judy Shelton joins Treasury Secretary Bessent as adviser, and her remarks on yields.
    related: []
    n_items: 2
    n_core: 2
  E_TRUMP_RUSSIA_DIESEL_DEAL:
    definition: 'Trump''s deal with Russia to supply diesel (first reported 10-09T22:00), its legal and political reaction, and diesel-price coverage naming the deal. Core headlines name the Russia deal. Peripheral: diesel-price coverage that names only Trump''s diesel moves or order and not the Russia deal (e2220c, 9c7ec0, 10d6af).'
    related: []
    n_items: 9
    n_core: 6
  E_ENERGY_CEASEFIRE:
    definition: 'The Russia-Ukraine energy-infrastructure ceasefire declared 10-11 and the first report on its scope (10-12). The 10-15 breakdown report (34653b) is labelled NONE with related_events here, because it arrives 88h after the last member and plan 5.4 links within 72h only.'
    related: []
    n_items: 2
    n_core: 2
  E_IRAN_HORMUZ_ATTACKS:
    definition: Iran's attacks on shipping in the Strait of Hormuz (ships sunk, tactics shifted, oil price reaction named in the headline).
    related: []
    n_items: 4
    n_core: 4
  E_BOFA_PENALTY:
    definition: Bank of America's US$1.2bn money-laundering/sanctions fine and the share drop after it and Q3 revenue miss.
    related: []
    n_items: 3
    n_core: 3
  E_GEORGIEVA_AI:
    definition: 'Same CNBC report republished twice: IMF chief Georgieva on AI as hope and hazard.'
    related: []
    n_items: 2
    n_core: 2
  E_WB_JOBS_COUNCIL:
    definition: 'Same CNBC report republished twice: World Bank jobs council urges crisis-era employment support.'
    related: []
    n_items: 2
    n_core: 2
  E_ANDURIL_CEO_DEFENCE:
    definition: 'Same CNBC report republished twice: Anduril CEO defends Trump administration contracts.'
    related: []
    n_items: 2
    n_core: 2
  E_ADVICE_LOSER_PORTFOLIO:
    definition: Same MarketWatch advice column republished twice (not news, but a real duplicate).
    related: []
    n_items: 3
    n_core: 2
  E_ADVICE_SISTER_HOME:
    definition: Same MarketWatch advice column republished with a new headline.
    related: []
    n_items: 2
    n_core: 2
  E_OPENAI_RECORDING_DEVICE:
    definition: Saudi OpenAI employee charged with planting a recording device.
    related: []
    n_items: 2
    n_core: 2
  E_ZACHARIA_CREDENTIALS:
    definition: New White House press secretary Katie Zacharia and her bar-exam claim.
    related: []
    n_items: 3
    n_core: 3
  E_SPAIN_EVICTION:
    definition: Death of the Spanish pensioner whose eviction sparked protests, and the protests.
    related: []
