sector_news_integration:
  enabled: true
  macro_sector_weight: 0.75
  news_sector_weight: 0.25
  news_score_frequency: daily
  news_score_decay_days: 14
  news_confidence_penalty: 0.05
  max_news_adjustment: 0.50
  min_news_item_count: 1
  require_recent_news: false
  output_label: experimental_combined_sector_diagnostic
  output_dir: outputs

  # News layer placement.
  #   overlay  = news enters combined_score at news_sector_weight (existing behaviour)
  #   advisory = news does NOT enter combined_score; it is published as a separate,
  #              separately attributable block in news_advisory_block.json
  # Default stays `overlay` so the shipped diagnostic is byte-identical to before.
  advisory_block:
    mode: overlay
    output_file: news_advisory_block.json
    min_direction_score: 0.05
    min_items_for_direction: 2
