    name: Leading Index for the United States
    provider: FRED
    dimension: health_test
    frequency: monthly
    required: false
    enabled: false
    reason_disabled: discontinued_or_stale
    stale_after_days: 45
    unusable_after_days: 120

  - series_id: ICSA
    name: Initial Claims
    provider: FRED
    dimension: growth
    frequency: weekly
    required: true
