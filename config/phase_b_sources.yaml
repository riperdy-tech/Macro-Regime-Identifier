    frequency: daily
    required: true
    enabled: true
    stale_after_days: 5
    unusable_after_days: 15
    publication_lag_days: 1

  # --- WS-B additive series (NOT part of regime classification) -------------
  # Both have full 1990+ FRED history. Wired into NEW non-regime dimensions
  # (monetary_liquidity, housing_activity) consumed only by sector exposures.
  # required:false so a fetch gap never invalidates the regime timeline.
  - series_id: M2SL
    name: M2 Money Supply
    provider: FRED
    dimension: monetary_liquidity
    frequency: monthly
    required: false
    enabled: true
    stale_after_days: 45
    unusable_after_days: 120
    publication_lag_days: 55

  - series_id: HOUST
    name: Housing Starts, Total New Privately Owned
    provider: FRED
    dimension: housing_activity
    frequency: monthly
    required: false
    enabled: true
    stale_after_days: 45
    unusable_after_days: 120
    publication_lag_days: 47

  # --- Capital-market anchor series (dimension: capital_market_anchors) --------
  # Inputs to the anchors/ layer ONLY. Like the WS-B block above, required:false so
  # a fetch gap can never invalidate the regime timeline, and they are referenced by
  # NO dimension and NO regime: the anchors consume raw LEVELS (a yield, a breakeven,
  # a potential-output index), so z-scored features would be the wrong instrument and
  # adding unreferenced features would perturb stored feature/health outputs for no
  # consumer. See docs/ANCHOR_METHODOLOGY.md and config/anchors.yaml.
  - series_id: DFII10
    name: 10-Year TIPS Real Yield (inflation-indexed constant maturity)
    provider: FRED
    dimension: capital_market_anchors
    frequency: daily
    required: false
    enabled: true
    stale_after_days: 5
