    publication_lag_days: 1

  - series_id: T10YIE
    name: 10-Year Breakeven Inflation Rate
    provider: FRED
    dimension: capital_market_anchors
    frequency: daily
    required: false
    enabled: true
    stale_after_days: 5
    unusable_after_days: 15
    publication_lag_days: 1

  - series_id: T5YIFR
    name: 5-Year, 5-Year Forward Inflation Expectation Rate
    provider: FRED
    dimension: capital_market_anchors
    frequency: daily
    required: false
    enabled: true
    stale_after_days: 5
    unusable_after_days: 15
    publication_lag_days: 1

  - series_id: DTB3
    name: 3-Month Treasury Bill Secondary Market Rate
    provider: FRED
    dimension: capital_market_anchors
    frequency: daily
    required: false
    enabled: true
    stale_after_days: 5
    unusable_after_days: 15
    publication_lag_days: 1

  - series_id: GDPPOT
    name: Real Potential Gross Domestic Product (CBO)
    provider: FRED
    dimension: capital_market_anchors
    frequency: quarterly
    required: false
    enabled: true
    stale_after_days: 140
    unusable_after_days: 400
    publication_lag_days: 120

  - series_id: THREEFYTP10
    name: Fitted Term Premium on a 10-Year Zero Coupon Bond (Kim-Wright)
    provider: FRED
    dimension: capital_market_anchors
    frequency: daily
    required: false
    enabled: true
    stale_after_days: 10
    unusable_after_days: 30
    publication_lag_days: 5

features:
  - feature_id: industrial_production_yoy_z
    series_id: INDPRO
    transform: yoy_pct_change
    normalization: rolling_z_5y
    direction: higher_is_growth_positive
    enabled: true
    min_observations: 24

  - feature_id: payrolls_yoy_z
    series_id: PAYEMS
    transform: yoy_pct_change
    normalization: rolling_z_5y
    direction: higher_is_growth_positive
    enabled: true
    min_observations: 24

  - feature_id: unemployment_6m_change_z
    series_id: UNRATE
    transform: diff_6m
    normalization: rolling_z_5y
    direction: higher_is_growth_negative
    enabled: true
    min_observations: 24

  - feature_id: unemployment_12m_change_z
    series_id: UNRATE
    transform: diff_12m
    normalization: rolling_z_5y
    direction: higher_is_growth_negative
    enabled: true
    min_observations: 24

  # Inflation features use a 10y window (promoted from the Phase 2 inflation
  # window experiment): a 5y window recenters during long inflation episodes,
  # reading persistent high inflation as normal. 10y improved NBER AUROC
  # 0.873 -> 0.888 at an unchanged false-positive share.
  - feature_id: headline_cpi_yoy_z
    series_id: CPIAUCSL
    transform: yoy_pct_change
    normalization: rolling_z_10y
    direction: higher_is_inflationary
    enabled: true
    min_observations: 24

  - feature_id: pce_price_yoy_z
    series_id: PCEPI
    transform: yoy_pct_change
    normalization: rolling_z_10y
    direction: higher_is_inflationary
    enabled: true
    min_observations: 24

  - feature_id: fed_funds_level_z
    series_id: FEDFUNDS
    transform: level
    normalization: rolling_z_10y
    direction: higher_is_policy_tight
    enabled: true
    min_observations: 24

  - feature_id: fed_funds_6m_change_z
    series_id: FEDFUNDS
    transform: diff_6m
    normalization: rolling_z_10y
    direction: higher_is_policy_tight
    enabled: true
    min_observations: 24

  - feature_id: ten_year_yield_level_z
    series_id: DGS10
    transform: level
    normalization: rolling_z_10y
    direction: higher_is_policy_tight
    enabled: true
    min_observations: 60

  - feature_id: baa_spread_level_z
    series_id: BAA10Y
    transform: level
    normalization: rolling_z_5y
    direction: higher_is_credit_tight
    enabled: true
    min_observations: 60

  - feature_id: nfci_level_z
    series_id: NFCI
    transform: level
    normalization: rolling_z_5y
    direction: higher_is_credit_tight
    enabled: true
    min_observations: 52

  - feature_id: yield_curve_10y2y_level_z
    series_id: T10Y2Y
    transform: level
    normalization: rolling_z_10y
    direction: higher_is_growth_positive
    enabled: true
    min_observations: 60

  - feature_id: disabled_leading_index_level_z
    series_id: USSLIND
    transform: level
    normalization: rolling_z_5y
    direction: higher_is_growth_positive
    enabled: false
    reason_disabled: discontinued_or_stale
    min_observations: 24

  - feature_id: initial_claims_level_z
    series_id: ICSA
    transform: level
    normalization: rolling_z_5y
    direction: higher_is_growth_negative
    enabled: true
    min_observations: 52

  - feature_id: high_yield_oas_level_z
    series_id: BAMLH0A0HYM2
    transform: level
    normalization: rolling_z_5y
    direction: higher_is_credit_tight
    enabled: true
    min_observations: 60

  # --- WS-B additive features (feed non-regime sector dimensions only) ------
  - feature_id: m2_money_supply_yoy_z
    series_id: M2SL
    transform: yoy_pct_change
    normalization: rolling_z_5y
    direction: higher_is_liquidity_loose
    enabled: true
    min_observations: 24

  - feature_id: housing_starts_yoy_z
    series_id: HOUST
    transform: yoy_pct_change
    normalization: rolling_z_5y
    direction: higher_is_housing_strong
    enabled: true
    min_observations: 24

dimensions:
  - dimension_id: growth_momentum
    enabled: true
    required_for_regime: true
    min_valid_features: 3
    min_coverage_ratio: 0.60
    features:
      - feature_id: industrial_production_yoy_z
        weight: 0.30
        polarity: positive
      - feature_id: payrolls_yoy_z
        weight: 0.30
        polarity: positive
      - feature_id: unemployment_6m_change_z
        weight: 0.25
        polarity: negative
      - feature_id: initial_claims_level_z
        weight: 0.15
        polarity: negative

  - dimension_id: inflation_pressure
    enabled: true
    required_for_regime: true
    min_valid_features: 2
    min_coverage_ratio: 0.75
    features:
      - feature_id: headline_cpi_yoy_z
        weight: 0.50
        polarity: positive
      - feature_id: pce_price_yoy_z
        weight: 0.50
        polarity: positive

  - dimension_id: policy_stance
    enabled: true
    required_for_regime: true
    min_valid_features: 2
    min_coverage_ratio: 0.60
    features:
      - feature_id: fed_funds_level_z
        weight: 0.40
        polarity: negative
      - feature_id: fed_funds_6m_change_z
        weight: 0.30
        polarity: negative
      - feature_id: ten_year_yield_level_z
        weight: 0.30
        polarity: negative

  - dimension_id: credit_liquidity
    enabled: true
    required_for_regime: true
    min_valid_features: 2
    min_coverage_ratio: 0.60
    features:
      - feature_id: baa_spread_level_z
        weight: 0.35
        polarity: negative
      - feature_id: nfci_level_z
        weight: 0.35
        polarity: negative
      - feature_id: high_yield_oas_level_z
        weight: 0.30
        polarity: negative

  - dimension_id: yield_curve
    enabled: true
    required_for_regime: true
    min_valid_features: 1
    min_coverage_ratio: 1.00
    features:
      - feature_id: yield_curve_10y2y_level_z
        weight: 1.00
        polarity: positive

  # --- WS-B additive dimensions (required_for_regime: false) ----------------
  # NOT listed in any regime's `dimensions:` weight map, so they are computed
  # but excluded from regime classification. Consumed only by sector exposures.
  - dimension_id: monetary_liquidity
    enabled: true
    required_for_regime: false
    min_valid_features: 1
    min_coverage_ratio: 1.00
    features:
      - feature_id: m2_money_supply_yoy_z
        weight: 1.00
        polarity: positive

  - dimension_id: housing_activity
    enabled: true
    required_for_regime: false
    min_valid_features: 1
    min_coverage_ratio: 1.00
    features:
      - feature_id: housing_starts_yoy_z
        weight: 1.00
        polarity: positive

regime_scoring:
  probability_method: softmax
  # Calibrated in Phase L. Temperature 0.6 improved probability separation
  # without changing raw-score rankings or regime transitions.
  softmax_temperature: 0.6

historical_diagnostic:
  start_date: "1990-01-01"
  end_date: null
  mode: revised_data
  min_valid_regimes: 2
  # Rescaled for the normalized-peakedness confidence metric (1 - entropy/ln N).
  # Distribution over 1990->present: median ~0.15, 2020 COVID ~0.95. ~0.10 flags
  # genuinely mixed backdrops without crying wolf on every modest plurality.
  low_confidence_threshold: 0.10
  # Raw monthly probabilities remain unsmoothed; a reported-regime switch
  # requires modest peakedness (~p25 of the new scale). Promoted from the
  # phase2_hysteresis experiment: low-confidence switches additionally need
  # two consecutive months of the same raw leader (32 -> 27 switches over
  # 1990-2026), while switches at confidence >= 0.15 stay immediate so
  # crisis flips are not delayed.
  transition_filter:
    enabled: true
    min_confidence_to_switch: 0.08
    confirmation_months: 2
    only_when_confidence_below: 0.15
  smoothing:
    enabled: false
    min_months_before_switch: 2
    probability_gap_required: 0.10

reports:
  output_dir: outputs
  include_feature_details: true
  include_dimension_details: true
  include_diagnostic_summary: true
  max_contributors: 5

# same_date | calendar_asof | point_in_time
#
# calendar_asof (default, unchanged): an evaluation date sees the latest observation
# on or before it, minus a fixed per-series `publication_lag_days` approximation.
#
# point_in_time: an evaluation date sees the value that was ACTUALLY PUBLISHED as of
# that date, resolved from stored ALFRED vintages (raw_observation_vintages). It is
# strictly stronger evidence than the fixed lag, and is opt-in because switching it
# silently would move the factual basis under every existing historical diagnostic.
# Populate vintages first with scripts/backfill_vintages.py.
#
# HYBRID BOUNDARY (measured 2026-09-20, docs/ANCHOR_METHODOLOGY.md §6.2b). ALFRED's archive
# is not uniform: the risk-free curve does not exist before 2005-07, the breakeven leg before
# 2014-02, the observed ACM term premium before 2016-06. `point_in_time_start` is therefore
# where PIT takes over; earlier dates use `calendar_asof` and say so in provenance. A blanket
# point-in-time switch would not upgrade those dates, it would EMPTY them (1995/2000: no
# risk-free curve, ERP undefined; 2008: no breakeven, no ERP solve).
scoring_mode: point_in_time
point_in_time_start: "2014-02-01"

evaluation_calendar:
  frequency: monthly
  date_rule: month_start
  start_date: "1990-01-01"
  end_date: null
  as_of_policy: latest_observation_on_or_before_date
  max_lag_by_frequency:
    daily: 10
    weekly: 21
    monthly: 75
    quarterly: 140
    annual: 450

regimes:
  - regime_id: goldilocks
    enabled: true
    min_valid_dimensions: 3
    min_coverage_ratio: 0.60
    dimensions:
      - dimension_id: growth_momentum
        weight: 0.30
        polarity: positive
      - dimension_id: inflation_pressure
        weight: 0.25
        polarity: penalize_positive_only
        # S1.1 (S0 measurement): E[penalize_positive_only] on inflation_pressure over the
        # clean 1990-01..2026-09 store = -0.429 (regime_dimension_contributions, valid rows).
        # Centring intercept removes the accidental polarity prior; see P0_0 §2.2.
        intercept: 0.429
      - dimension_id: credit_liquidity
        weight: 0.20
        polarity: positive
      - dimension_id: policy_stance
        weight: 0.15
        polarity: reward_near_zero
        # S1.1 (S0 measurement): E[reward_near_zero] on policy_stance over the clean
        # 1990-01..2026-09 store = -0.889. See P0_0 §2.2.
        intercept: 0.889
      - dimension_id: yield_curve
        weight: 0.10
        polarity: positive

  - regime_id: reflation
    enabled: true
    min_valid_dimensions: 3
    min_coverage_ratio: 0.60
    dimensions:
      - dimension_id: growth_momentum
        weight: 0.30
        polarity: positive
      - dimension_id: inflation_pressure
        weight: 0.25
        polarity: positive
      - dimension_id: credit_liquidity
        weight: 0.20
        polarity: positive
      - dimension_id: policy_stance
        weight: 0.15
        polarity: positive
      - dimension_id: yield_curve
        weight: 0.10
        polarity: positive

  - regime_id: stagflation
    enabled: true
    min_valid_dimensions: 3
    min_coverage_ratio: 0.60
    dimensions:
      - dimension_id: growth_momentum
        weight: 0.30
        polarity: negative
      - dimension_id: inflation_pressure
        weight: 0.30
        polarity: positive
      - dimension_id: credit_liquidity
        weight: 0.15
        polarity: negative
      - dimension_id: policy_stance
        weight: 0.15
        polarity: negative
      - dimension_id: yield_curve
        weight: 0.10
        polarity: negative

  - regime_id: recession
    enabled: true
    min_valid_dimensions: 3
    min_coverage_ratio: 0.60
    dimensions:
      - dimension_id: growth_momentum
        weight: 0.35
        polarity: negative
      - dimension_id: inflation_pressure
        weight: 0.10
        polarity: penalize_positive_only
        # S1.1 (S0 measurement): E[penalize_positive_only] on inflation_pressure over the
        # clean 1990-01..2026-09 store = -0.429. See P0_0 §2.2.
        intercept: 0.429
      - dimension_id: credit_liquidity
        weight: 0.25
        polarity: negative
      - dimension_id: policy_stance
        weight: 0.15
        polarity: positive
      - dimension_id: yield_curve
        weight: 0.15
        polarity: negative

  - regime_id: tightening
    enabled: true
    min_valid_dimensions: 3
    min_coverage_ratio: 0.60
    dimensions:
      - dimension_id: growth_momentum
        weight: 0.18
        polarity: positive
      - dimension_id: inflation_pressure
        weight: 0.27
        polarity: positive
      - dimension_id: credit_liquidity
        weight: 0.10
        polarity: negative
      - dimension_id: policy_stance
        weight: 0.32
        polarity: negative
      - dimension_id: yield_curve
        weight: 0.13
        polarity: negative
