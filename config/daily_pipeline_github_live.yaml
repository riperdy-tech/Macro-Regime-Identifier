# GitHub Actions live-AI daily pipeline config.
# Use only when workflow_dispatch run_mode=live is selected.
# Requires GitHub Secrets for FRED_API_KEY and DEEPSEEK_API_KEY.

daily_pipeline:
  macro:
    enabled: true
    config_path: config/phase_b_sources.yaml
    mode: live

  sector:
    enabled: true
    config_path: config/phase_b_sources.yaml
    sector_config_path: config/sectors.yaml
    exposure_config_path: config/sector_exposures.yaml
    prior_config_path: config/sector_regime_priors.yaml

  news:
    enabled: true
    source_profile: live_rss
    news_sources_config: config/news_sources.yaml
    news_ai_config: config/news_ai_live.yaml
    news_themes_config: config/news_themes.yaml
    news_scoring_config: config/news_scoring.yaml
    allow_live_ai: true
    mock_mode_default: false
    history_dir: outputs/news_history

  live_ai_safety:
    max_items_per_run: 60
    classify_only_unclassified: true
    continue_on_individual_failure: true
    stop_on_failure_rate_above: 0.20

  combined:
    enabled: true
    config_path: config/sector_news_integration.yaml

  monitoring:
    enabled: true
    config_path: config/news_monitoring.yaml
    source_profile: live_rss

  safety:
    # OA-3 (2026-09-23, approved): raised from a 15-min deadline / 30-min job
    # timeout so live classification can reach its existing 60-item/day cap
    # instead of ~15 (§0.2 of NEWS_PART1_SPEC.md). Budget at the new settings:
    # setup+tests ~6.7m (measured, run 35829508938) + daily diagnostic up to
    # ~31m (30-min deadline plus the scoring step's measured overrun past it)
    # + after-steps ~1.5m =~ 40m against the 45-min job timeout (~5m margin).
    # Not yet verified against a real run at these settings -- re-measure
    # after the first live run and tighten this comment.
    overall_run_timeout_minutes: 30
    fail_on_guardrail_violation: true

  outputs:
    archive_enabled: true
    archive_root: outputs/archive
