# Entity -> ticker resolution (MRI_EVENTS_PLAN v2 section 8, E0.3).
#
# Names are normalised before comparison: lower-cased, accents folded, punctuation turned into spaces, a
# leading "the" dropped, and the trailing legal-suffix tokens below removed (repeatedly, so "Foo Holdings Inc"
# -> "foo"). A normalised name is then matched EXACTLY against the stocks.json names and the SEC
# company_tickers_exchange.json titles. More than one distinct ticker = `ambiguous` and is rejected. Nothing
# fuzzy, no substring, no token overlap.
#
# Only `exact` and `alias` matches enter the `named` exposure tier.

legal_suffixes:
  - inc
  - incorporated
  - corp
  - corporation
  - holdings
  - holding
  - plc
  - ltd
  - limited
  - co
  - company

# Curated nicknames and rebrands: names a news item uses that are NOT the legal name of any listed company, so
# grouping by SEC cik cannot reach them. An alias names one ticker and resolves to that company's common lines
# ("google" -> GOOGL and GOOG). Each target must exist in the stocks.json / SEC universe or the alias is
# ignored and reported. An alias wins over an exact match for the same normalised name. Do not add a name
# because exact matching rejected it as ambiguous: that means two companies share it, and the answer is no.
aliases:
  meta: META           # Meta Platforms
  facebook: META       # former name
  google: GOOGL        # Alphabet's product name
  exxon: XOM           # ExxonMobil
  exxon mobil: XOM
  amazon: AMZN         # Amazon.com
  jpmorgan: JPM        # JPMorgan Chase
  lululemon: LULU      # lululemon athletica
  ford: F              # Ford Motor

# Entities that name no particular event actor and would link unrelated events if used as a shared entity (E1).
# Compared after the same normalisation. They resolve to status `generic` and are never `named`.
# Deliberately NOT here: the Fed, Treasury, White House, Congress, named countries, the EU. They discriminate
# events, and plan section 5.4 needs the Fed as a linking entity.
generic_entities:
  - united states
  - us
  - u s
  - usa
  - united states government
  - us government
  - u s government
  - u s federal government
  - federal government
  - government
  - the market
  - markets
  - wall street
  - investors
  - economists
  - analysts

# Classifier entity types that are never companies; they are recorded as `skipped_type`, not dropped.
non_company_entity_types:
  - country
  - region
  - person
