name: Weekly Secular Theme Discovery

# WS-C: once a week, propose EMERGING secular themes from recent news, gate them
# with the anti-noise promotion test, and push any survivors to a REVIEW branch
# (never straight to master). A human reviews the diff and merges.
#
# Cost: up to two cost-gated DeepSeek discovery calls (--max-calls 2), ~cents/month.

on:
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Hard cap on DeepSeek discovery calls"
        required: false
        type: string
        default: "2"
  schedule:
    # Sundays ~07:23 UTC (off the :00 mark)
    - cron: "23 7 * * 0"

permissions:
  contents: write
  # Needed by the run-failure guard below, which opens/updates a GitHub Issue.
  issues: write

concurrency:
  group: "weekly-themes"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ingest recent news (real feeds)
        run: python -m macro_engine.cli ingest-news --profile live_rss

      - name: Discover + promote themes (cost-gated)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/discover_themes.py \
            --apply --promote \
            --max-calls "${{ inputs.max_calls || '2' }}"

      - name: Upload discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-theme-discovery-output
          path: |
            outputs/candidate_themes.json
            outputs/theme_discovery_error.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Push promoted themes to a review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- config/news_themes.yaml; then
            echo "No new themes promoted this week."
          else
            BRANCH="auto/theme-proposals"
            git checkout -b "$BRANCH"
            git add config/news_themes.yaml
            git commit -m "chore(themes): weekly secular-theme proposals for review [skip ci]"
            git push --force origin "$BRANCH"
            echo "Pushed proposals to $BRANCH - open a PR to review/merge."
          fi

      - name: Report run failure
        # This workflow had no alerting path at all: it exited 1 on 2026-08-02 and
        # 2026-08-09 (empty DeepSeek discovery response, response_length=0 on every
        # attempt) and nothing surfaced it.
        if: ${{ always() && job.status != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          gh label create mgi-run-failure \
            --repo "$REPO" \
            --color b60205 \
            --description "A scheduled workflow run did not succeed" >/dev/null 2>&1 || true

          BODY=$(printf '%s\n' \
            "Workflow **$WORKFLOW** finished with status \`$JOB_STATUS\`." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "If discovery failed, the \`weekly-theme-discovery-output\` artifact holds" \
            "\`theme_discovery_error.json\` with the per-attempt diagnostics." \
            "" \
            "_Automated - posted by the run-failure guard._")

          EXISTING=$(gh issue list --repo "$REPO" --label mgi-run-failure --state open \
            --search "$WORKFLOW in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "${EXISTING:-}" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY" || true
          else
            gh issue create --repo "$REPO" \
              --title "MGI run failure: $WORKFLOW" \
              --body "$BODY" \
              --label mgi-run-failure || true
          fi
